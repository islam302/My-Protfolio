# Continuous integration: quality gates, tests, builds, container images + scans.
# Nothing here deploys anything (see deploy.yml, manual only).
#
# Action pinning: every action is pinned to a full commit SHA (resolved with
# git ls-remote on 2026-11-23), tag in the trailing comment. Dependabot
# (github-actions ecosystem) proposes SHA bumps.
name: CI

on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  CI: "true"
  # Never send telemetry / never prompt.
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

jobs:
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
        continue-on-error: true   # advisory until the codebase is fully formatted
      - run: npm run typecheck
      - name: Unit tests (all workspaces; API uses in-process PGlite)
        run: npm test
      - name: Build web + admin (original mode, PUBLIC_API_URL unset)
        run: npm run build
      - name: Site checks (links, meta, assets)
        run: npm run check
      - name: Build web in API mode
        run: npm run build -w @portfolio/web
        env:
          PUBLIC_API_URL: /api
      - name: npm audit (production + dev, high and above)
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  api-integration:
    name: API integration tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.12-alpine3.24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres     # throwaway CI-only service container
          POSTGRES_DB: portfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/portfolio_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: API test suite against real Postgres
        run: npm test -w @portfolio/api
      - name: Root integration suites (tests/integration), if any
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(tests/integration/**/*.test.js)
          if (( ${#files[@]} )); then node --test --test-concurrency=1 "${files[@]}"; else echo "no tests/integration suites"; fi

  # ---------------------------------------------------------------------------
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build web + admin
        run: npm run build
      - name: Install Playwright browsers (version from the lockfile)
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  docker:
    name: Docker images, Trivy scan, compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          tags: portfolio-api:ci
          load: true
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          build-args: |
            SITE_URL=http://localhost:8080
            PUBLIC_API_URL=/api
          tags: portfolio-web:ci
          load: true
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Trivy scan — API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: portfolio-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy scan — web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: portfolio-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Compose smoke test (health + security headers through nginx)
        shell: bash
        env:
          API_IMAGE: portfolio-api:ci
          WEB_IMAGE: portfolio-web:ci
        run: |
          set -euo pipefail
          # Throwaway secrets, generated per run, never stored.
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 32)"
            echo "IP_HASH_SECRET=$(openssl rand -base64 48)"
            echo "PUBLIC_ORIGIN=http://localhost:8080"
          } > "$RUNNER_TEMP/ci.env"
          dc() { docker compose --env-file "$RUNNER_TEMP/ci.env" "$@"; }
          dc config -q
          dc up -d --no-build --wait --wait-timeout 180
          bash infrastructure/deployment/smoke-test.sh http://127.0.0.1:8080
      - name: Compose logs (on failure)
        if: failure()
        run: docker compose --env-file "$RUNNER_TEMP/ci.env" logs --no-color --tail=200 || true
      - name: Compose down
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/ci.env" down -v || true
