# Security scanning: secrets, SAST, dependency/config scan, DAST (ZAP baseline
# against the local compose stack only). Weekly + on PRs to main.
#
# Actions are pinned to full commit SHAs (tag in the trailing comment); container
# images are pinned by tag — pin digests too for full reproducibility.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # whole history
          persist-credentials: false
      # Uses the gitleaks CLI image instead of gitleaks-action (the action needs
      # a paid licence for organisation-owned repos).
      - name: gitleaks detect
        run: |
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="*" -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.140.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep scan
        run: |
          semgrep scan \
            --config p/javascript --config p/nodejs --config p/owasp-top-ten --config p/secrets \
            --exclude node_modules --exclude dist --exclude 'tests/**' \
            --metrics off --error --sarif --output semgrep.sarif
      - name: Upload SARIF artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  codeql:
    name: CodeQL (javascript)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write    # upload results to code scanning
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:javascript"

  trivy-fs:
    name: Trivy filesystem + IaC config scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies / secrets (lockfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Misconfiguration (Dockerfiles, compose, workflows)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  zap-baseline:
    name: DAST (OWASP ZAP baseline, local stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack (localhost only)
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 32)"
            echo "IP_HASH_SECRET=$(openssl rand -base64 48)"
            echo "PUBLIC_ORIGIN=http://localhost:8080"
            echo "SITE_URL=http://localhost:8080"
          } > "$RUNNER_TEMP/zap.env"
          docker compose --env-file "$RUNNER_TEMP/zap.env" up -d --build --wait --wait-timeout 300
      - name: ZAP baseline (passive scan, target = 127.0.0.1 only)
        run: |
          mkdir -p "$RUNNER_TEMP/zap" && chmod 777 "$RUNNER_TEMP/zap"
          cp .github/zap/rules.tsv "$RUNNER_TEMP/zap/rules.tsv"
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8080/ -c rules.tsv \
              -r zap-report.html -J zap-report.json -m 3 -I
          # -I: WARN-level alerts do not fail the job; rules set to FAIL in rules.tsv do.
      - name: Upload ZAP report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: ${{ runner.temp }}/zap/
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/zap.env" down -v || true
