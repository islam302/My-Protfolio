<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
    <title>Inquiries — Admin — Islam Badran</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="./admin.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body class="adm">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="adm-header">
      <p class="adm-brand">ISLAM BADRAN <span class="adm-brand__tag">admin</span></p>
      <div class="adm-user" id="user-box" hidden>
        <span class="adm-user__email" id="user-email"></span>
        <button class="btn btn--ghost adm-btn" id="logout" type="button">Log out</button>
      </div>
    </header>

    <main id="main" class="adm-main">
      <p class="adm-boot" id="boot" role="status">Checking your session…</p>
      <noscript><p class="adm-boot">The admin panel needs JavaScript.</p></noscript>

      <!-- Login -->
      <section class="adm-login" id="login-view" aria-labelledby="login-title" hidden>
        <form class="adm-card" id="login-form" method="post" novalidate>
          <h1 class="adm-h1" id="login-title" tabindex="-1">Sign in</h1>
          <p class="adm-note" id="login-note" hidden></p>
          <div class="adm-field">
            <label for="login-email">Email</label>
            <input
              id="login-email"
              name="email"
              type="email"
              autocomplete="username"
              required
              maxlength="254"
              spellcheck="false"
              autocapitalize="off"
            />
          </div>
          <div class="adm-field">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              maxlength="256"
            />
          </div>
          <p class="adm-error" id="login-error" role="alert" hidden></p>
          <button class="btn btn--light adm-btn" id="login-submit" type="submit">Sign in</button>
        </form>
      </section>

      <!-- Inquiries -->
      <section class="adm-list" id="list-view" aria-labelledby="list-title" hidden>
        <div class="adm-list__head">
          <h1 class="adm-h1" id="list-title" tabindex="-1">Inquiries</h1>
          <button class="btn btn--ghost adm-btn" id="refresh" type="button">Refresh</button>
        </div>

        <form class="adm-filters" id="filters" role="search" aria-label="Filter inquiries">
          <div class="adm-field adm-field--grow">
            <label for="f-q">Search name or message</label>
            <input id="f-q" name="q" type="search" maxlength="100" autocomplete="off" spellcheck="false" />
          </div>
          <div class="adm-field">
            <label for="f-status">Status</label>
            <select id="f-status" name="status">
              <option value="">All statuses</option>
            </select>
          </div>
          <div class="adm-field">
            <label for="f-type">Project type</label>
            <select id="f-type" name="type">
              <option value="">All types</option>
            </select>
          </div>
          <div class="adm-field">
            <label for="f-sort">Order</label>
            <select id="f-sort" name="sort">
              <option value="-createdAt">Newest first</option>
              <option value="createdAt">Oldest first</option>
            </select>
          </div>
          <div class="adm-filters__actions">
            <button class="btn btn--light adm-btn" type="submit">Search</button>
            <button class="btn btn--ghost adm-btn" id="filters-reset" type="button">Clear</button>
          </div>
        </form>

        <p class="adm-status" id="list-status" role="status" aria-live="polite"></p>
        <div class="adm-alert" id="list-error" role="alert" hidden>
          <p id="list-error-text"></p>
          <button class="btn btn--light adm-btn" id="list-retry" type="button">Try again</button>
        </div>

        <div class="adm-table-wrap" id="table-wrap">
          <table class="adm-table" id="table" aria-describedby="list-status">
            <caption class="sr-only">
              Inquiries
            </caption>
            <thead>
              <tr>
                <th scope="col" id="th-date" aria-sort="descending">
                  <button class="adm-sort" id="sort-date" type="button">
                    Received <span class="adm-sort__icon" aria-hidden="true"></span>
                  </button>
                </th>
                <th scope="col">Name</th>
                <th scope="col">Type</th>
                <th scope="col">Channel</th>
                <th scope="col">Status</th>
                <th scope="col"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="adm-empty" id="empty" hidden></p>

        <nav class="adm-pager" id="pager" aria-label="Pagination" hidden>
          <button class="btn btn--ghost adm-btn" id="page-prev" type="button">← Previous</button>
          <span class="adm-pager__info" id="page-info"></span>
          <button class="btn btn--ghost adm-btn" id="page-next" type="button">Next →</button>
        </nav>
      </section>
    </main>

    <!-- Detail -->
    <dialog class="adm-dialog" id="detail" aria-labelledby="detail-title">
      <div class="adm-dialog__head">
        <h2 class="adm-h2" id="detail-title">Inquiry</h2>
        <button class="btn btn--ghost adm-btn" id="detail-close" type="button">Close</button>
      </div>
      <div id="detail-body" hidden>
        <dl class="adm-meta" id="detail-meta"></dl>
        <h3 class="adm-h3">Message</h3>
        <p class="adm-message" id="detail-message"></p>
        <form class="adm-edit" id="detail-form" novalidate>
          <div class="adm-field">
            <label for="d-status">Status</label>
            <select id="d-status" name="status"></select>
          </div>
          <div class="adm-field">
            <label for="d-notes">Notes <span class="adm-opt">(private)</span></label>
            <textarea id="d-notes" name="notes" rows="5" maxlength="4000" aria-describedby="d-notes-count"></textarea>
            <p class="adm-hint" id="d-notes-count"></p>
          </div>
          <div class="adm-edit__actions">
            <button class="btn btn--light adm-btn" id="detail-save" type="submit">Save changes</button>
            <button class="btn adm-btn adm-btn--danger" id="detail-delete" type="button">Delete…</button>
          </div>
        </form>
      </div>
      <p class="adm-status adm-status--detail" id="detail-status" role="status" aria-live="polite"></p>
    </dialog>

    <!-- Delete confirmation -->
    <dialog
      class="adm-dialog adm-dialog--sm"
      id="confirm"
      role="alertdialog"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-text"
    >
      <h2 class="adm-h2" id="confirm-title">Delete this inquiry?</h2>
      <p class="adm-note" id="confirm-text"></p>
      <div class="adm-edit__actions">
        <button class="btn btn--light adm-btn" id="confirm-cancel" type="button">Cancel</button>
        <button class="btn adm-btn adm-btn--danger" id="confirm-ok" type="button">Delete</button>
      </div>
    </dialog>
  </body>
</html>
