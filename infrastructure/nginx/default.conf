# Site + admin + API reverse proxy (plain HTTP on 8080).
#
# - docker-compose: this is the edge (published on 127.0.0.1:8080 by default).
# - production (Hetzner VM): docker-compose.prod.yml adds tls.example.conf
#   (:8081 ACME/redirect, :8443 TLS) and publishes only 80/443; this :8080
#   server is then container-internal (HEALTHCHECK only). HSTS and
#   upgrade-insecure-requests switch on automatically over HTTPS.

# Long immutable cache only for versioned asset URLs (/css/x.css?v=…); an
# unversioned URL (e.g. the admin's /css/site.css) is revalidated every time.
map $arg_v $asset_cache_control {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 8080 default_server;
    # listen [::]:8080 default_server;   # enable when the host/container has IPv6
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 404 /404.html;

    include /etc/nginx/snippets/app-locations.conf;
}
