# Main nginx config for nginxinc/nginx-unprivileged (runs as uid 101).
# Works with a read-only root filesystem: pid + temp paths live in /tmp (tmpfs).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript application/json text/plain image/svg+xml application/manifest+json text/xml;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Structured access log -> stdout (collected by the Docker logging driver).
    # Never log query strings of /api (search terms) or cookies/authorization.
    map $request_uri $log_uri {
        ~^(?<p>/api/[^?]*)\?  $p?[redacted];
        default               $request_uri;
    }
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$log_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /dev/stdout json;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65s;
    client_header_timeout 15s;
    client_body_timeout   15s;
    send_timeout          30s;
    # Site + admin never accept bodies; /api overrides this to 16k (contract body limit).
    client_max_body_size 1k;
    absolute_redirect off;   # relative Location headers (correct behind any port / proxy)

    # --- compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/manifest+json application/xml image/svg+xml font/ttf;
    # Brotli: the official nginx images do not ship ngx_brotli. Either build a
    # custom image with the module (load_module + `brotli on; brotli_static on;`)
    # or let the CDN / TLS edge do brotli. woff2/jpg/webp/mp4 are already compressed.

    # --- HSTS / upgrade-insecure-requests only over HTTPS -----------------
    # "$https" is "on" when nginx terminates TLS itself (tls.example.conf).
    # When TLS terminates at a trusted load balancer it sends X-Forwarded-Proto:
    # https. (A client spoofing this over plain HTTP gains nothing: browsers
    # ignore HSTS received over HTTP.)
    map "$https:$http_x_forwarded_proto" $hsts {
        "~^on:"     "max-age=63072000; includeSubDomains; preload";
        "~:https$"  "max-age=63072000; includeSubDomains; preload";
        default     "";
    }
    map "$https:$http_x_forwarded_proto" $csp_upgrade {
        "~^on:"     "; upgrade-insecure-requests";
        "~:https$"  "; upgrade-insecure-requests";
        default     "";
    }

    # Scheme reported to the API (X-Forwarded-Proto).
    map "$https:$http_x_forwarded_proto" $forwarded_proto {
        "~^on:"     https;
        "~:https$"  https;
        default     http;
    }

    # Real client IP when a trusted load balancer / CDN sits in front of nginx.
    # Off by default (nginx is the edge in docker-compose). See snippets/real-ip.conf.
    # include /etc/nginx/snippets/real-ip.conf;

    # --- rate limiting (defense in depth; the API enforces the real limits) --
    # Per-IP budget for everything under /api/.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # Tighter budget for state-changing requests (inquiries, login, admin writes).
    map $request_method $api_write_key {
        POST    $binary_remote_addr;
        PUT     $binary_remote_addr;
        PATCH   $binary_remote_addr;
        DELETE  $binary_remote_addr;
        default "";
    }
    limit_req_zone $api_write_key zone=api_write:10m rate=30r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
