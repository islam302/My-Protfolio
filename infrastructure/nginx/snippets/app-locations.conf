# All locations of the site/admin/API server. Included by default.conf (HTTP :8080)
# and by tls.example.conf (HTTPS) so headers and routing never drift.

# --- nginx's own liveness probe (container HEALTHCHECK) -----------------
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# --- never serve dotfiles (.env, .git, …) ------------------------------
# Regex locations win over the plain prefix locations below.
location ~ /\.(?!well-known/) {
    access_log off;
    return 404;
}

# --- API (same origin) --------------------------------------------------
# Health endpoints: proxied with a generous per-IP limit. /ready runs a DB query, so an
# unlimited endpoint would be a cheap DB-load lever (SEC-06). 10 r/s + burst 40 is far
# above any uptime monitor's needs.
location ^~ /api/health {
    limit_except GET { deny all; }
    limit_req  zone=api burst=40 nodelay;
    error_page 429 = @api_429;
    error_page 502 503 504 = @api_unavailable;
    include /etc/nginx/snippets/proxy-api.conf;
}

location ^~ /api/ {
    client_max_body_size 16k;                 # contract body limit (16 KiB)
    limit_req  zone=api burst=40 nodelay;
    limit_req  zone=api_write burst=20 nodelay;
    limit_conn perip 20;

    error_page 413 = @api_413;
    error_page 429 = @api_429;
    error_page 502 503 504 = @api_unavailable;
    include /etc/nginx/snippets/proxy-api.conf;
}

# JSON envelopes for errors generated by nginx itself (contract format).
location @api_413 {
    default_type application/json;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/common-headers.conf;
    return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body too large","requestId":"$request_id"}}';
}
location @api_429 {
    default_type application/json;
    add_header Retry-After "60" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/common-headers.conf;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests","requestId":"$request_id"}}';
}
location @api_unavailable {
    default_type application/json;
    add_header Retry-After "10" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/common-headers.conf;
    return 503 '{"error":{"code":"INTERNAL","message":"Service temporarily unavailable","requestId":"$request_id"}}';
}

# --- admin panel (static, stricter CSP, never cached) -------------------
location = /admin {
    return 301 /admin/;
}
location /admin/ {
    limit_except GET { deny all; }            # GET implies HEAD
    root /usr/share/nginx;                    # /admin/x -> /usr/share/nginx/admin/x
    try_files $uri $uri/ =404;
    include /etc/nginx/snippets/security-headers-admin.conf;
}

# --- static assets ------------------------------------------------------
location /fonts/ {
    limit_except GET { deny all; }
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
}
location /images/ {
    limit_except GET { deny all; }
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000" always;
    include /etc/nginx/snippets/security-headers.conf;
}
location /media/ {
    limit_except GET { deny all; }
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000" always;
    include /etc/nginx/snippets/security-headers.conf;
}
location /css/ {
    limit_except GET { deny all; }
    try_files $uri =404;
    add_header Cache-Control $asset_cache_control always;
    include /etc/nginx/snippets/security-headers.conf;
}
location /js/ {
    limit_except GET { deny all; }
    try_files $uri =404;
    add_header Cache-Control $asset_cache_control always;
    include /etc/nginx/snippets/security-headers.conf;
}

# --- HTML and everything else: always revalidate ------------------------
location / {
    limit_except GET { deny all; }
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
}
