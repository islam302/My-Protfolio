# Reverse proxy to the Fastify API (included by /api/ locations).
#
# The upstream is resolved at request time through Docker's embedded DNS
# (127.0.0.11), so nginx starts even if the API is not up yet and follows the
# container when it is recreated. Outside Docker, change resolver + $api_upstream.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;
set $api_upstream http://api:3000;
# No URI part on proxy_pass with a variable => the original request URI is passed as-is.
proxy_pass $api_upstream;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Overwrite (do NOT append) forwarding headers: $remote_addr is the real client
# (after real_ip, if a trusted LB is configured). The API runs with
# TRUST_PROXY=1 and therefore trusts exactly this one hop.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-Id $request_id;

proxy_connect_timeout 5s;
proxy_send_timeout 15s;
proxy_read_timeout 30s;
proxy_buffering on;
proxy_intercept_errors off;   # API error envelopes pass through untouched

# nginx is authoritative for the transport-level security headers; the API's
# own Content-Security-Policy (strict JSON policy / Swagger UI) is kept.
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Permissions-Policy;
include /etc/nginx/snippets/common-headers.conf;
