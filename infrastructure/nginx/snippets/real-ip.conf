# Restore the real client IP from X-Forwarded-For — ONLY when nginx sits behind
# a load balancer / CDN you control. Never trust X-Forwarded-For from the open
# internet: anyone could pick their own IP and dodge rate limits.
#
# Enable by uncommenting the include in nginx.conf and listing the proxy CIDRs.
# (Cloudflare publishes its ranges at https://www.cloudflare.com/ips/.)
#
# set_real_ip_from 10.0.0.0/8;        # e.g. your LB subnet
# set_real_ip_from 2001:db8::/32;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;
