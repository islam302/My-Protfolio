# Stricter policy for /admin/: no inline script, no inline style, no data: fonts.
# The admin loads /css/site.css + /fonts from the same origin and talks to /api.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'$csp_upgrade" always;
add_header Cache-Control "no-store" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Request-Id $request_id always;
include /etc/nginx/snippets/common-headers.conf;
