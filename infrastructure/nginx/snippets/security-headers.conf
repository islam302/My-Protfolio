# Security headers for the public site. Included in EVERY location that sets its
# own add_header (nginx drops inherited add_header directives as soon as a
# location declares one).
#
# The site CSP and its hashes live here AND in /vercel.json (the static site is
# also deployed to Vercel). Keep the two identical: when the inline script or the
# /work/ <style> block changes, update the hashes in both files, then load the pages through the compose stack and check the browser
# console for CSP violations (the E2E suite runs against a plain Node server and
# does not exercise these headers).
#
# CSP notes
# - script-src: only same-origin files + the single inline bootstrap script in
#   apps/web/src/templates/layout.js:
#     <script>document.documentElement.classList.add('js')</script>
#   sha256 of `document.documentElement.classList.add('js')` (exact bytes, UTF-8)
#   = Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo=
#   If that script changes, recompute:
#     printf '%s' "<script body>" | openssl dgst -sha256 -binary | openssl base64
#   <script type="application/ld+json"> / type="application/json" blocks are
#   data blocks, never executed, and are not subject to script-src.
# - Styles (CSP Level 3 split):
#   style-src-elem 'self' 'sha256-vRSASVDSHjJBYSp8loYBJjH4gx4PLn5Y817EG9Uuv8M='
#     = stylesheets from our origin + the single inline <style> block on /work/
#     (hash of its exact contents; recompute if that block changes).
#   style-src-attr 'unsafe-inline' = the inline style="" attributes the design
#     uses (CSS custom properties per card). Risk: an HTML-injection bug could
#     restyle the page (UI redress, CSS attribute-selector exfiltration).
#     Mitigated: the static site renders no user content, there is no
#     third-party CSS, and img/font/connect-src are 'self' so CSS cannot beacon
#     off-origin. Drop it once inline styles move to classes.
#   style-src 'self' 'unsafe-inline' is only the fallback for browsers without
#     style-src-elem/-attr (pre-2022 Firefox/Safari); modern browsers ignore it
#     for elements/attributes because the -elem/-attr directives take precedence.
# - media-src blob:: home.js loads the hero dive clip with fetch() and plays it
#   from URL.createObjectURL(blob) (streamed seeks stall otherwise).
# - form-action 'self' mailto:: the no-JS fallback of the brief form submits to
#   its mailto: action, and CSP form-action applies to that navigation.
#   WhatsApp (https://wa.me) is opened with window.open()/links, which is NOT a
#   form submission, so it does not need to be in form-action (least privilege).
# - connect-src 'self': the form posts to the same-origin /api.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo='; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'sha256-vRSASVDSHjJBYSp8loYBJjH4gx4PLn5Y817EG9Uuv8M='; style-src-attr 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'none'; frame-src 'none'; form-action 'self' mailto:; frame-ancestors 'none'; base-uri 'none'; object-src 'none'$csp_upgrade" always;
add_header X-Request-Id $request_id always;
include /etc/nginx/snippets/common-headers.conf;
