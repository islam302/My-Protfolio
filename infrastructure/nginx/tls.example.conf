# Production TLS termination at nginx (Hetzner VM). Mounted by
# docker-compose.prod.yml as /etc/nginx/conf.d/tls.conf, next to default.conf
# (default.conf keeps serving plain HTTP on :8080 inside the container, for the
# container HEALTHCHECK only — it is not published in production).
#
# "example" = the domain names below are the owner's; change islambadran.com
# if you deploy under another domain. Everything else is used as-is.
#
# Ports: nginx-unprivileged cannot bind <1024, so it listens on 8081 (HTTP)
# and 8443 (HTTPS); docker-compose.prod.yml publishes host 80->8081, 443->8443.
#
# Certificates (Let's Encrypt, certbot on the host, webroot challenge):
#   - certbot writes the http-01 tokens into ${PORTFOLIO_SHARED}/acme, mounted
#     read-only at /var/www/acme and served by the :8081 server below.
#   - certbot's deploy hook (infrastructure/deployment/certbot-deploy-hook.sh)
#     copies fullchain.pem + privkey.pem into ${PORTFOLIO_SHARED}/certs with
#     uid 101 (nginx) ownership, mounted read-only at /etc/nginx/certs, and
#     reloads nginx. See infrastructure/deployment/DEPLOYMENT.md.
#
# Profile: Mozilla "intermediate" (TLS 1.2 + 1.3). Check with
#   https://ssl-config.mozilla.org/  and  https://www.ssllabs.com/ssltest/

# ---- TLS (http context: inherited by every server in this file) ----------
ssl_certificate         /etc/nginx/certs/fullchain.pem;
ssl_certificate_key     /etc/nginx/certs/privkey.pem;
ssl_protocols           TLSv1.2 TLSv1.3;
ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;       # TLS 1.3 + modern clients pick well
ssl_ecdh_curve          X25519:prime256v1:secp384r1;
ssl_session_timeout     1d;
ssl_session_cache       shared:TLS:10m;
ssl_session_tickets     off;         # forward secrecy across restarts

# OCSP stapling is intentionally OFF: Let's Encrypt shut down its OCSP service
# in 2025 (certificates carry no OCSP URL), so there is nothing to staple.
# If you switch to a CA that still runs OCSP, enable:
#   ssl_stapling on; ssl_stapling_verify on;
#   ssl_trusted_certificate /etc/nginx/certs/chain.pem;
#   resolver 1.1.1.1 9.9.9.9 valid=300s;

# ---- :80 — ACME http-01 + redirect to HTTPS ------------------------------
server {
    listen 8081 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://islambadran.com$request_uri;
    }
}

# ---- :443 — www -> apex ----------------------------------------------------
server {
    listen 8443 ssl;
    http2 on;
    server_name www.islambadran.com;
    include /etc/nginx/snippets/common-headers.conf;
    return 308 https://islambadran.com$request_uri;
}

# ---- :443 — the site, /admin/, /api/ --------------------------------------
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name islambadran.com;

    # Over HTTPS, $https = "on", so the maps in nginx.conf emit
    # Strict-Transport-Security (2 years, includeSubDomains, preload) and add
    # upgrade-insecure-requests to the CSP. Only submit the domain to
    # hstspreload.org once every subdomain is HTTPS-only.

    root  /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/snippets/security-headers.conf;
    error_page 404 /404.html;
    include /etc/nginx/snippets/app-locations.conf;
}
